name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform folders (keep our lib/main.dart)
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          flutter create --org com.functionofus --project-name function_of_us_studio .
          cp /tmp/main.dart.bak lib/main.dart

      - name: Prepare Android project (permissions, minSdk, ndkVersion)
        run: python3 tool/add_permissions.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: function-of-us-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish download release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Function of Us Studio v1.0.0
          body: |
            Installable Android APKs for **Function of Us Studio** — a cinematic
            math-story graph video generator.

            Download by device:
            - `app-arm64-v8a-release.apk` — modern phones (recommended)
            - `app-armeabi-v7a-release.apk` — older 32-bit devices
            - `app-x86_64-release.apk` — emulators

            Signed with the debug key: installs by sideload, not for Play Store upload.
          files: build/app/outputs/flutter-apk/*.apk
